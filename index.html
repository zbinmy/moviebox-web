<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090d"><meta name="description" content="MovieBox-inspired discovery, watchlist, and browser playback shell.">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://image.tmdb.org"><link rel="preconnect" href="https://api.themoviedb.org">
  <link rel="stylesheet" href="./styles.css"><title>MovieBox</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="MovieBox Home"><span class="brand-mark">M</span><span>movie<span class="accent">box</span></span></a>
    <label class="searchbox"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Search movies and shows" autocomplete="off" aria-label="Search movies and shows"><button id="clearSearch" class="search-clear hidden" aria-label="Clear search">×</button></label>
    <button class="avatar" id="profileButton" aria-label="Open profile">M</button>
  </header>
  <main id="app" tabindex="-1"><div class="loading-screen"><span class="spinner"></span>Loading MovieBox…</div></main>
  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="#/home" data-tab="home"><span class="nav-icon">⌂</span><span>Home</span></a>
    <a href="#/novelhub" data-tab="novelhub"><span class="nav-icon">▤</span><span>NovelHub</span></a>
    <a href="#/downloads" data-tab="downloads"><span class="nav-icon">⇩</span><span>Downloads</span></a>
    <a href="#/me" data-tab="me"><span class="nav-icon">◉</span><span>Me</span></a>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
